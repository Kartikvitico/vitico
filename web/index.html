<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VITICO Wholesale</title>
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VITICO">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F1F5FB;--surface:#FFFFFF;--sunk:#E3EAF5;--ink:#0C1B4D;--muted:#56618A;--line:#CFD8EA;
  --brand:#0E2265;--brand-ink:#FFFFFF;--oxide:#C23B2E;--signal:#42BAFE;--signal-ink:#0C1B4D;--good:#1B7F47;--warn:#E9A21B;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Barlow,"Segoe UI",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
h1,h2,h3,.fig,.unit,.count{font-family:"Baloo 2","Trebuchet MS",Verdana,sans-serif;font-weight:700;line-height:1.15;margin:0}
h1{font-size:2rem}h2{font-size:1.3rem}h3{font-size:1.15rem;font-weight:600}
p{margin:0}.muted{color:var(--muted)}.small{font-size:.875rem}
a{color:var(--brand)}
button,select,input,textarea{font:inherit;color:inherit}
button,a,select,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html{overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar1{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1160px;margin:0 auto;padding:10px 16px}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto;text-decoration:none;color:var(--muted);font-weight:500;font-size:.875rem}
#who{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand img{height:40px;width:auto;display:block}
.who{display:flex;align-items:center;gap:6px;font-size:.875rem;color:var(--muted)}
select,input[type=text],input[type=email],input[type=password],input[type=search],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;max-width:100%}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.deal{background:var(--signal);color:var(--signal-ink)}
.btn.sm{padding:5px 10px;font-size:.875rem}
.cartbtn b{background:var(--brand-ink);color:var(--brand);border-radius:10px;padding:0 7px;margin-left:4px}
nav{max-width:1160px;margin:0 auto;padding:0 8px;display:flex;overflow-x:auto;gap:2px}
nav a{padding:9px 10px;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap;border-bottom:3px solid transparent}
nav a.on{color:var(--ink);border-color:var(--signal)}
main{max-width:1160px;margin:0 auto;padding:22px 16px 60px}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:18px}
.head p{flex-basis:100%}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel h2{margin-bottom:10px}
.panel+.panel,.grid+.panel,.panel+.grid,.grid+.grid{margin-top:14px}
.grid>.panel{margin-top:0}
.fig{font-size:1.9rem}
.meter{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden;margin:8px 0}
.meter i{display:block;height:100%;background:var(--brand)}
.meter.warn i{background:var(--warn)}.meter.sky i{background:var(--signal)}.meter.over i{background:var(--oxide)}
.tag{display:inline-block;font-size:.8rem;font-weight:600;padding:1px 9px;border-radius:10px;background:var(--sunk);white-space:nowrap}
.tag.t-go{background:#DDF1E5;color:var(--good)}.tag.t-deal{background:var(--signal);color:var(--signal-ink)}.tag.t-bad{background:#F8DEDA;color:var(--oxide)}
.err{color:var(--oxide);font-weight:500}.ok{color:var(--good);font-weight:500}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:.875rem}
td.num,th.num{text-align:right}
table.kv{min-width:0}table.kv th{width:45%}
td input[type=number]{width:84px}td input[type=text]{width:150px}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.filters input{flex:1 1 220px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:5px 12px;cursor:pointer}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.prod{display:grid;grid-template-columns:56px 1fr auto;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.tile{width:56px;height:56px;border-radius:10px;color:#fff;display:grid;place-items:center;font-weight:600}
.ladder{list-style:none;display:flex;flex-wrap:wrap;gap:6px;padding:0;margin:8px 0}
.ladder li{border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:.875rem}
.ladder li b{display:block;font-size:1rem}
.ladder li.on{border-color:var(--signal);background:#E4F4FF}
details summary{cursor:pointer;color:var(--muted);font-size:.875rem}
.steps{list-style:none;padding:0;margin:6px 0 0;font-size:.875rem;max-width:400px}
.steps li{display:flex;justify-content:space-between;gap:12px;padding:2px 0;border-bottom:1px dashed var(--line)}
.pbuy{text-align:right;min-width:190px}
.unit{font-size:1.5rem}
.unit small{font:400 .8rem Barlow,Arial,sans-serif;color:var(--muted)}
.stepper{display:inline-flex;align-items:center;gap:4px;margin:8px 0}
.stepper button{width:32px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font-weight:600}
.stepper input{width:64px;text-align:center}
@media (max-width:640px){.prod{grid-template-columns:56px 1fr}.pbuy{grid-column:1/-1;text-align:left}}

.box{position:relative;height:120px;border:3px solid var(--brand);border-radius:6px;background:var(--sunk);display:flex;overflow:hidden}
.box::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 13px,rgba(12,27,77,.14) 13px 15px);pointer-events:none}
.box span{height:100%;transition:width .25s}
.box.over{border-style:dashed;border-color:var(--oxide)}
.boxcap{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 14px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}

.deal{border-top:5px solid var(--signal)}
.deal header{display:flex;justify-content:space-between;gap:10px;align-items:start;margin-bottom:6px}
.count{font-size:1.05rem;white-space:nowrap}

.hero{background:var(--brand);color:#fff;border-radius:16px;padding:36px 28px;display:grid;gap:28px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));align-items:center}
.hero h1{font-size:clamp(1.9rem,4.5vw,2.9rem);max-width:16ch}
.hero p{max-width:46ch;margin:12px 0 20px;color:#D5DDF6}
.hero .btn{background:var(--signal);color:var(--signal-ink);margin-right:8px}
.hero .btn.ghost{background:transparent;color:#fff;border-color:#6C7BB5}
.livebox{background:#fff;color:var(--ink);border-radius:12px;padding:16px}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.form .wide{grid-column:1/-1}
.field{display:grid;gap:4px;font-size:.875rem;color:var(--muted)}
.field>*{color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}

.shade{position:fixed;inset:0;background:rgba(12,27,77,.55);z-index:40;display:flex;justify-content:flex-end}
.shade.center{justify-content:center;align-items:center;padding:16px}
.drawer{background:var(--surface);width:min(460px,100%);height:100%;overflow-y:auto;padding:18px;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.drawer .field{margin-top:10px}
.dialog{background:var(--surface);border-radius:14px;width:min(440px,100%);max-height:100%;overflow-y:auto;padding:20px}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.tot{display:flex;justify-content:space-between;padding:4px 0}
.tot.big{font:700 1.4rem "Baloo 2",Verdana,sans-serif;border-top:2px solid var(--ink);margin-top:6px;padding-top:8px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;max-width:90vw;display:none}
.note{font-size:.8rem;color:var(--muted);margin-top:26px;border-top:1px solid var(--line);padding-top:10px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
</style>
</head>
<body>
<div class="top">
  <div class="bar1">
    <a class="brand" href="#"><img src="logo.png" alt="Vitico"><span>Wholesale</span></a>
    <span id="who"></span>
  </div>
  <nav id="nav" aria-label="Main"></nav>
</div>
<main id="view"><p class="muted">Loading…</p></main>
<div id="layer"></div>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
